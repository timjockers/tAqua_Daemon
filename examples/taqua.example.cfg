// Example tAqua configuration file
//
// This file shows the structure of taqua.cfg.
//
// This is an example configuration file.
// The actual taqua.cfg file is located in / and is
// written by tAqua_Web and read by tAqua_Daemon.



// Relay configuration
// 0: Not used
// 1: Relay - valve
// 2: Relay - continuous power, switched off when the valve is activated
relayConfig = (1, 1, 1, 0, 0, 0, 0, 2);


// Irrigation time in seconds when the button is pressed
buttonIrrigationTime = 300;


// Scheduled events
scheduled = (
    {   
        relay = 0;        // Relay (0-7)
        start = (6, 300); // Start (weekday 0-6, minutes past midnight 0-1439) -> Saturday, 5 AM.
        duration = 60;    // Duration (seconds)
        condition = {};   // Condition (group used in a later version for, e.g., weather or sensor conditions)
    },
    {
        relay = 1;
        start = (6, 300);
        duration = 120;
        condition = {};
    },
    {   
        relay = 2;
        start = (6, 300);
        duration = 90;
        condition = {};
    }
);
